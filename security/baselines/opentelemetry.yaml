  path: "SKILL.md"
  message: "*references/collector-config.md (partial)*"
  reason: "FP: Scanner limitation: the static shell parser hit its span limit on markdown/JS (backtick code spans, `${obj.prop}` template literals, `<placeholder>` text) or a missing repo-path reference; not evasion. Vendored from grafana/skills (skills-lock.json); not edited locally."
- id: "AE1"
  path: "SKILL.md"
