  reason: "FP: Scanner limitation: the static shell parser hit its span limit on markdown/JS (backtick code spans, `${obj.prop}` template literals, `<placeholder>` text) or a missing repo-path reference; not evasion. Vendored from grafana/skills (skills-lock.json); not edited locally."
- id: "PE5"
  path: "references/instrumentation.md"
  message: "*--privileged*"
  reason: "TP – upstream PR: Beyla Docker example uses --privileged; Beyla documents a capability-based alternative (BPF, PERFMON, SYS_PTRACE, ...) that should be the default example. Vendored from grafana/skills (skills-lock.json); not edited locally."
- id: "PE5"
  path: "references/instrumentation.md"
  message: "*--network host*"
  reason: "FP: Host networking is required for Beyla to observe host traffic in the documented deployment; documentation of a required setting. Vendored from grafana/skills (skills-lock.json); not edited locally."
- id: "TM4"
  path: "references/instrumentation.md"
  message: "*hostPID: true*"
  reason: "FP: hostPID is required by the Beyla DaemonSet to see node processes; documented requirement. Vendored from grafana/skills (skills-lock.json); not edited locally."
- id: "TM4"
  path: "references/instrumentation.md"
  message: "*privileged: true*"
  reason: "TP – upstream PR: Beyla DaemonSet example runs privileged; upstream should show the capability-based securityContext instead. Vendored from grafana/skills (skills-lock.json); not edited locally."
- id: "TM4"
  path: "references/instrumentation.md"
  message: "*hostPath:*"
  reason: "FP: Read-only style mount of /sys/kernel/security required by eBPF; documented requirement. Vendored from grafana/skills (skills-lock.json); not edited locally."
- id: "PE2"
  path: "references/collector-config.md"
  message: "*sudo*"
  reason: "FP: `sudo apt-get install alloy` is a human install instruction in a reference doc, not an agent instruction. Vendored from grafana/skills (skills-lock.json); not edited locally."
