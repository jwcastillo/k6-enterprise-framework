# perf-smoke.yml — Manual performance smoke test via GitHub Actions UI
#
# Trigger: workflow_dispatch (manual from GitHub Actions UI or via API)
#
# Usage via API (curl):
#   curl -X POST \
#     -H "Authorization: token $GITHUB_PAT" \
#     -H "Accept: application/vnd.github.v3+json" \
#     https://api.github.com/repos/<owner>/<repo>/actions/workflows/perf-smoke.yml/dispatches \
#     -d '{"ref":"main","inputs":{"client":"_reference","env":"staging","profile":"smoke"}}'
#
# Secrets required (set in repo Settings → Secrets and variables → Actions):
#   PERF_SLACK_WEBHOOK    — Slack incoming webhook URL (optional)
#   PERF_EMAIL_TO         — Email notification recipient (optional)
#   PERF_NOTIFY_WEBHOOK   — Generic webhook URL (optional)

name: Performance Smoke Test

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client name (directory under clients/)"
        required: true
        default: "_reference"
      env:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - local
          - staging
          - production
      test:
        description: "Test file path (relative to client scenarios/)"
        required: false
        default: ""
      profile:
        description: "Load profile"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - load
          - stress
          - soak
          - breakpoint
      notify:
        description: "Notification channels"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - slack
          - email
          - slack,email

# Prevent concurrent smoke runs for the same client
concurrency:
  group: perf-smoke-${{ github.event.inputs.client }}-${{ github.event.inputs.env }}
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Smoke — ${{ github.event.inputs.client }} / ${{ github.event.inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"

      - name: Put k6 in a trusted directory
        # The runners never resolve k6 through PATH (bin/_run-guard.sh).
        run: sudo install -m 0755 "$(command -v k6)" /usr/local/bin/k6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Build TypeScript
        run: npm run build

      - name: Validate client config
        env:
          # Inputs por env, nunca interpolados en el script (inyección de shell).
          IN_CLIENT: ${{ github.event.inputs.client }}
          IN_ENV: ${{ github.event.inputs.env }}
        run: |
          node bin/validate-config.js \
            --client="${IN_CLIENT}" \
            --env="${IN_ENV}"

      - name: Run smoke test
        id: run-test
        env:
          NOTIFY_SLACK_WEBHOOK: ${{ secrets.PERF_SLACK_WEBHOOK }}
          NOTIFY_EMAIL_TO: ${{ secrets.PERF_EMAIL_TO }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.PERF_NOTIFY_WEBHOOK }}
          IN_CLIENT: ${{ github.event.inputs.client }}
          IN_ENV: ${{ github.event.inputs.env }}
          IN_PROFILE: ${{ github.event.inputs.profile }}
          IN_NOTIFY: ${{ github.event.inputs.notify }}
          IN_TEST: ${{ github.event.inputs.test }}
        run: |
          ARGS=(
            "--client=${IN_CLIENT}"
            "--env=${IN_ENV}"
            "--profile=${IN_PROFILE}"
            "--notify=${IN_NOTIFY}"
            "--out=json=reports/smoke-${IN_CLIENT}-${{ github.run_id }}.json"
          )
          if [[ -n "${IN_TEST}" ]]; then
            ARGS+=("--test=${IN_TEST}")
          fi
          bash bin/run-test.sh "${ARGS[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Generate HTML report
        if: always()
        env:
          IN_CLIENT: ${{ github.event.inputs.client }}
        run: |
          node bin/generate-report.js \
            --input "reports/smoke-${IN_CLIENT}-${{ github.run_id }}.json" \
            --output "reports/smoke-${IN_CLIENT}-${{ github.run_id }}.html" \
            --type smoke || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-smoke-report-${{ github.run_id }}
          path: reports/smoke-${{ github.event.inputs.client }}-${{ github.run_id }}.*
          retention-days: 30

      - name: Post result summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Inputs por env: interpolarlos en el script abre inyección de JavaScript.
          IN_CLIENT: ${{ github.event.inputs.client }}
          IN_ENV: ${{ github.event.inputs.env }}
          IN_PROFILE: ${{ github.event.inputs.profile }}
        with:
          script: |
            const exitCode = '${{ steps.run-test.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASS' : '❌ FAIL';
            const summary = `## Performance Smoke Test — ${status}

            | Field        | Value |
            |---|---|
            | Client       | \`${process.env.IN_CLIENT}\` |
            | Environment  | \`${process.env.IN_ENV}\` |
            | Profile      | \`${process.env.IN_PROFILE}\` |
            | Exit code    | \`${exitCode}\` |
            | Run ID       | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            > Report attached as workflow artifact.`;

            await core.summary.addRaw(summary).write();
