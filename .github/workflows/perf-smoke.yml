# perf-smoke.yml — Manual performance smoke test via GitHub Actions UI
#
# Trigger: workflow_dispatch (manual from GitHub Actions UI or via API)
#
# Usage via API (curl):
#   curl -X POST \
#     -H "Authorization: token $GITHUB_PAT" \
#     -H "Accept: application/vnd.github.v3+json" \
#     https://api.github.com/repos/<owner>/<repo>/actions/workflows/perf-smoke.yml/dispatches \
#     -d '{"ref":"main","inputs":{"client":"_reference","env":"staging","scenario":"domain/orders-lifecycle","profile":"smoke"}}'
#
# Solo ofrece lo que CI puede correr. bin/run-test.sh pide una aprobación humana
# (exit 109) para los perfiles pesados (stress, spike, breakpoint, soak, capacity) y
# para los entornos fuera de nonProdEnvs (production); en CI no hay quien la firme.
# Esas corridas se lanzan desde una terminal con bin/approve-run.sh.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   PERF_SLACK_WEBHOOK    — Slack incoming webhook URL (optional, notify=slack)

name: Performance Smoke Test

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client name (directory under clients/)"
        required: true
        default: "_reference"
      env:
        description: "Target environment (must be in the client's nonProdEnvs)"
        required: true
        default: "staging"
        type: choice
        options:
          - default
          - staging
      scenario:
        description: "Scenario (<bucket>/<path> under clients/<client>/scenarios/)"
        required: true
        default: "domain/orders-lifecycle"
      profile:
        description: "Load profile (heavy profiles need a human approval and cannot run in CI)"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - quick
          - load
      notify:
        description: "Notification channel"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - slack

# Prevent concurrent smoke runs for the same client
concurrency:
  group: perf-smoke-${{ github.event.inputs.client }}-${{ github.event.inputs.env }}
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Smoke — ${{ github.event.inputs.client }} / ${{ github.event.inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"

      - name: Put k6 in a trusted directory
        # The runners never resolve k6 through PATH (bin/_run-guard.sh).
        run: sudo install -m 0755 "$(command -v k6)" /usr/local/bin/k6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Build TypeScript
        run: npm run build

      # Sin paso aparte de validate-config: bin/run-test.sh valida la config en su
      # Step 1, y validate-config.js --client busca clients/<c>/config.json, que
      # _reference no tiene (usa config/<env>.json): el paso tumbaba el job.
      - name: Run smoke test
        id: run-test
        env:
          # El runner falla cerrado si el cliente no trae rbac.json. En CI no hay
          # usuario al que autorizar; el bypass queda registrado en el audit log.
          K6_RBAC_PERMISSIVE: "true"
          IN_CLIENT: ${{ github.event.inputs.client }}
          IN_ENV: ${{ github.event.inputs.env }}
          IN_SCENARIO: ${{ github.event.inputs.scenario }}
          IN_PROFILE: ${{ github.event.inputs.profile }}
          RUN_DIR: reports/smoke-${{ github.run_id }}
        run: |
          # El runner rechaza un --reports-dir cuyo padre no existe, y reports/ no
          # esta en git: en un checkout limpio hay que crearlo.
          mkdir -p "${RUN_DIR}"
          # Usuario developer del rbac.json de referencia: con rbac.json el bypass no aplica.
          if [ "${IN_CLIENT}" = "_reference" ]; then export K6_USER=reference-dev; fi
          set +e
          bash bin/run-test.sh \
            --client="${IN_CLIENT}" \
            --env="${IN_ENV}" \
            --scenario="${IN_SCENARIO}" \
            --profile="${IN_PROFILE}" \
            --reports-dir="${RUN_DIR}"
          EXIT_CODE=$?
          set -e

          # El runner nombra los artefactos con un timestamp
          # (<reports-dir>/<client>/<scenario>/summary-<ISO>.json): se buscan.
          SUMMARY="$(find "${RUN_DIR}" -name 'summary-*.json' 2>/dev/null | sort | tail -1 || true)"

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          exit "${EXIT_CODE}"

      - name: Notify Slack
        if: always() && github.event.inputs.notify == 'slack' && steps.run-test.outputs.summary != ''
        env:
          NOTIFY_SLACK_WEBHOOK: ${{ secrets.PERF_SLACK_WEBHOOK }}
          SUMMARY: ${{ steps.run-test.outputs.summary }}
          IN_CLIENT: ${{ github.event.inputs.client }}
          IN_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          if [[ -z "${NOTIFY_SLACK_WEBHOOK}" ]]; then
            echo "::warning::notify=slack but the PERF_SLACK_WEBHOOK secret is not set"
            exit 0
          fi
          node bin/notify.js --result="${SUMMARY}" --webhook="${NOTIFY_SLACK_WEBHOOK}" \
            --title="Smoke ${IN_CLIENT}/${IN_SCENARIO}" || echo "::warning::Slack notification failed"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-smoke-report-${{ github.run_id }}
          path: reports/smoke-${{ github.run_id }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Post result summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Inputs por env: interpolarlos en el script abre inyección de JavaScript.
          IN_CLIENT: ${{ github.event.inputs.client }}
          IN_ENV: ${{ github.event.inputs.env }}
          IN_PROFILE: ${{ github.event.inputs.profile }}
          IN_SCENARIO: ${{ github.event.inputs.scenario }}
          EXIT_CODE: ${{ steps.run-test.outputs.exit_code }}
        with:
          script: |
            const exitCode = process.env.EXIT_CODE;
            const status = exitCode === '0' ? '✅ PASS' : '❌ FAIL';
            const summary = `## Performance Smoke Test — ${status}

            | Field        | Value |
            |---|---|
            | Client       | \`${process.env.IN_CLIENT}\` |
            | Environment  | \`${process.env.IN_ENV}\` |
            | Scenario     | \`${process.env.IN_SCENARIO}\` |
            | Profile      | \`${process.env.IN_PROFILE}\` |
            | Exit code    | \`${exitCode}\` |
            | Run ID       | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            > Report attached as workflow artifact.`;

            await core.summary.addRaw(summary).write();
