# perf-regression.yml — Nightly regression suite (scheduled)
#
# Trigger: cron schedule at 02:00 UTC every day + manual dispatch
#
# What it does:
#   1. Runs the configured regression suite for each client
#   2. Compares results against historical baseline (last 7 days)
#   3. Sends notifications if regressions are detected
#   4. Publishes consolidated report as artifact
#
# Secrets required:
#   PERF_SLACK_WEBHOOK   — Slack webhook for regression alerts
#   PERF_EMAIL_TO        — Email recipient for regression alerts
#
# To trigger via API:
#   curl -X POST \
#     -H "Authorization: token $GITHUB_PAT" \
#     https://api.github.com/repos/<owner>/<repo>/actions/workflows/perf-regression.yml/dispatches \
#     -d '{"ref":"main","inputs":{"client":"_reference","suite":"nightly","notify":"slack"}}'

name: Nightly Regression Suite

on:
  schedule:
    # 02:00 UTC daily
    - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      client:
        description: "Client name"
        required: true
        default: "_reference"
      suite:
        description: "Regression suite name"
        required: true
        default: "nightly"
      env:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      notify:
        description: "Notification channels"
        required: false
        default: "slack"
        type: choice
        options:
          - none
          - slack
          - email
          - slack,email

  # Allow calling from other workflows
  workflow_call:
    inputs:
      client:
        required: true
        type: string
      suite:
        required: false
        type: string
        default: "nightly"
      env:
        required: false
        type: string
        default: "staging"
    secrets:
      PERF_SLACK_WEBHOOK:
        required: false
      PERF_EMAIL_TO:
        required: false

concurrency:
  group: perf-regression-${{ github.event.inputs.client || '_reference' }}
  cancel-in-progress: false

jobs:
  regression:
    name: Regression — ${{ github.event.inputs.client || '_reference' }} / ${{ github.event.inputs.suite || 'nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history for baseline comparison
          fetch-depth: 0

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"

      - name: Put k6 in a trusted directory
        # The runners never resolve k6 through PATH (bin/_run-guard.sh).
        run: sudo install -m 0755 "$(command -v k6)" /usr/local/bin/k6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Build TypeScript
        run: npm run build

      - name: Run regression suite
        id: regression
        env:
          NOTIFY_SLACK_WEBHOOK: ${{ secrets.PERF_SLACK_WEBHOOK }}
          NOTIFY_EMAIL_TO: ${{ secrets.PERF_EMAIL_TO }}
          # Inputs por env, nunca interpolados en el script (inyección de shell).
          IN_CLIENT: ${{ github.event.inputs.client || '_reference' }}
          IN_SUITE: ${{ github.event.inputs.suite || 'nightly' }}
          IN_ENV: ${{ github.event.inputs.env || 'staging' }}
          IN_NOTIFY: ${{ github.event.inputs.notify || 'slack' }}
        run: |
          CLIENT="${IN_CLIENT}"
          SUITE="${IN_SUITE}"
          ENV="${IN_ENV}"
          NOTIFY="${IN_NOTIFY}"

          set +e
          bash bin/run-regression.sh \
            --suite="${SUITE}" \
            --client="${CLIENT}" \
            --env="${ENV}" \
            --notify="${NOTIFY}"
          EXIT_CODE=$?
          set -e

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "client=${CLIENT}" >> "$GITHUB_OUTPUT"
          echo "suite=${SUITE}" >> "$GITHUB_OUTPUT"

          case $EXIT_CODE in
            0)  echo "status=pass"     >> "$GITHUB_OUTPUT" ;;
            1)  echo "status=warn"     >> "$GITHUB_OUTPUT" ;;
            99) echo "status=critical" >> "$GITHUB_OUTPUT" ;;
            *)  echo "status=error"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-${{ steps.regression.outputs.client }}-${{ steps.regression.outputs.suite }}-${{ github.run_id }}
          path: reports/${{ steps.regression.outputs.client }}/regression/
          retention-days: 90

      - name: Set job summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const status = '${{ steps.regression.outputs.status }}';
            const exitCode = '${{ steps.regression.outputs.exit_code }}';
            const client = '${{ steps.regression.outputs.client }}';
            const suite = '${{ steps.regression.outputs.suite }}';

            const icon = { pass: '✅', warn: '⚠️', critical: '🔴', error: '❌' }[status] || '❓';
            const label = { pass: 'PASS', warn: 'SIGNIFICANT REGRESSIONS', critical: 'CRITICAL REGRESSIONS', error: 'ERROR' }[status] || 'UNKNOWN';

            const summary = `## ${icon} Nightly Regression — ${label}

            | Field     | Value |
            |---|---|
            | Client    | \`${client}\` |
            | Suite     | \`${suite}\` |
            | Exit code | \`${exitCode}\` |
            | Run       | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            > Report available as workflow artifact (retained 90 days).`;

            await core.summary.addRaw(summary).write();

      - name: Fail on critical regressions
        if: steps.regression.outputs.status == 'critical' || steps.regression.outputs.status == 'error'
        run: |
          echo "::error::Nightly regression suite: ${{ steps.regression.outputs.status }} (exit ${{ steps.regression.outputs.exit_code }})"
          exit 1
