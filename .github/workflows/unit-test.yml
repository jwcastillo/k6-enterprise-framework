name: Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/**'
      - 'clients/**'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/unit-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/**'
      - 'clients/**'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/unit-test.yml'

jobs:
  test:
    name: Vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
      # LINT-04 zero-tolerance gate: src/ + tracked clients/ (per-client gitignored trees
      # are absent in CI and carry separate CI in their standalone repos).
      # --max-warnings 0 fails on any warning; --error-on-unmatched-pattern fails loud
      # if a gitignore drift makes the glob match nothing (instead of false-greening).
      - name: Lint (zero-tolerance)
        run: pnpm --config.verifyDepsBeforeRun=false exec eslint 'src/**/*.ts' 'clients/**/*.ts' --max-warnings 0 --error-on-unmatched-pattern
      # LINT-04 typecheck gate: tsc --noEmit on tracked surface (tsconfig globs naturally
      # exclude archive/** and gitignored client trees).
      - name: Typecheck
        run: pnpm --config.verifyDepsBeforeRun=false exec tsc --noEmit
      # Coverage step also runs unit tests and enforces thresholds (60/55/60/60).
      # vitest exits non-zero when thresholds are violated — this is the COV-08 gate.
      - name: Run tests with coverage enforcement
        run: pnpm --config.verifyDepsBeforeRun=false run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '22' && always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
