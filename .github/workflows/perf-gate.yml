# perf-gate.yml — Performance quality gate for Pull Requests
#
# Trigger: pull_request (runs on every PR against main/develop)
# Blocks merge if quality gate fails (exit code 1).
#
# Secrets required:
#   PERF_SLACK_WEBHOOK  — Slack webhook for PR notifications (optional)
#
# To configure as a required status check:
#   GitHub repo Settings → Branches → Branch protection rules → Require status checks
#   Add: "Quality Gate / perf-gate"

name: Performance Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      # Only run when app code or perf tests change
      - "src/**"
      - "clients/**"
      - "bin/**"

  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      client:
        description: "Client name"
        required: true
        default: "_reference"
      env:
        description: "Target environment"
        required: true
        default: "staging"
      scenario:
        description: "Scenario to gate on (must be hermetic if the env is unreachable)"
        required: true
        default: "domain/orders-lifecycle"

concurrency:
  group: perf-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  perf-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El paso "Post PR comment with results" escribe en el PR; sin esto Octokit
    # falla con 403 y tumba el job entero.
    permissions:
      contents: read
      pull-requests: write

    # Output quality gate result for downstream jobs
    outputs:
      gate_passed: ${{ steps.quality-gate.outputs.gate_passed }}
      report_url: ${{ steps.quality-gate.outputs.report_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.2.0"

      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Build TypeScript
        run: npm run build

      - name: Run quality gate (smoke profile)
        id: quality-gate
        env:
          # T-088 / T-085: el runner todavia NO lee estas dos (grep en run-test.sh da 0).
          # Se dejan porque el contrato del pipeline ya las expone; hoy no tienen efecto.
          TEST_CONFIG: ${{ vars.PERF_TEST_CONFIG }}
          QG_THRESHOLDS_OVERRIDE: ${{ vars.PERF_QG_THRESHOLDS_OVERRIDE }}
          NOTIFY_SLACK_WEBHOOK: ${{ secrets.PERF_SLACK_WEBHOOK }}
          # El runner falla cerrado si el cliente no trae rbac.json. En CI no hay
          # usuario al que autorizar; el bypass queda registrado en el audit log.
          K6_RBAC_PERMISSIVE: "true"
        run: |
          CLIENT="${{ github.event.inputs.client || '_reference' }}"
          ENV="${{ github.event.inputs.env || 'staging' }}"
          SCENARIO="${{ github.event.inputs.scenario || 'domain/orders-lifecycle' }}"
          GATE_DIR="reports/gate-${{ github.run_id }}"

          set +e
          bash bin/run-test.sh \
            --client="${CLIENT}" \
            --env="${ENV}" \
            --scenario="${SCENARIO}" \
            --profile=smoke \
            --reports-dir="${GATE_DIR}"
          EXIT_CODE=$?
          set -e

          # El runner nombra los artefactos con un timestamp, asi que se busca el summary
          # en vez de construir la ruta.
          SUMMARY="$(find "${GATE_DIR}" -name 'summary-*.json' 2>/dev/null | sort | tail -1)"

          # Codigos del runner: 0 = thresholds cumplidos, 99 = SLOs no cumplidos,
          # 1 = error o regresion critica, 107 = error de build/script.
          case $EXIT_CODE in
            0)  echo "gate_passed=true"  >> "$GITHUB_OUTPUT" ;;
            *)  echo "gate_passed=false" >> "$GITHUB_OUTPUT" ;;
          esac

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "gate_dir=${GATE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Generate quality gate report
        if: always() && steps.quality-gate.outputs.summary != ''
        run: |
          node bin/generate-report.js \
            --input="${{ steps.quality-gate.outputs.summary }}" \
            --output="reports/gate-${{ github.run_id }}.html" || true

      - name: Upload gate report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-report-${{ github.run_id }}
          path: |
            reports/gate-${{ github.run_id }}/**
            reports/gate-${{ github.run_id }}.html
          retention-days: 14

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.quality-gate.outputs.gate_passed }}' === 'true';
            const exitCode = '${{ steps.quality-gate.outputs.exit_code }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const exitCodeDesc = {
              '0': 'All thresholds passed',
              '1': 'One or more thresholds failed',
              '2': 'Execution error',
              '99': 'Threshold failure with partial data'
            }[exitCode] || `Unknown (${exitCode})`;

            const body = `## ${passed ? '✅' : '❌'} Performance Quality Gate — ${passed ? 'PASS' : 'FAIL'}

            | Field       | Value |
            |---|---|
            | Exit code   | \`${exitCode}\` — ${exitCodeDesc} |
            | Profile     | \`smoke\` |
            | Environment | \`staging\` |
            | Report      | [View artifacts](${runUrl}) |

            ${!passed ? '> ⚠️ **This PR is blocked pending performance regression fix.**\n> Review the threshold failures in the artifact report.' : '> All performance thresholds are within acceptable limits.'}

            <sub>Generated by [perf-gate workflow](${runUrl})</sub>`;

            // Find existing comment to update (avoid duplicate comments)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('Performance Quality Gate'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if quality gate did not pass
        if: steps.quality-gate.outputs.gate_passed != 'true'
        run: |
          echo "::error::Performance quality gate FAILED (exit code: ${{ steps.quality-gate.outputs.exit_code }})"
          echo "Review the performance report artifact for threshold details."
          exit 1
