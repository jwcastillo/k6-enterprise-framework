# perf-gate.yml — Performance quality gate for Pull Requests
#
# Trigger: pull_request (runs on every PR against main/develop)
# Blocks merge if the quality gate fails (any non-zero exit from bin/run-test.sh).
#
# Secrets required:
#   PERF_SLACK_WEBHOOK  — Slack webhook for PR notifications (optional)
#
# To configure as a required status check:
#   GitHub repo Settings → Branches → Branch protection rules → Require status checks
#   Add: "Quality Gate / perf-gate"

name: Performance Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      # Only run when app code or perf tests change
      - "src/**"
      - "clients/**"
      - "bin/**"
      - ".github/workflows/perf-gate.yml"

  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      client:
        description: "Client name"
        required: true
        default: "_reference"
      env:
        description: "Target environment"
        required: true
        default: "staging"
      scenario:
        description: "Scenario to gate on (must be hermetic if the env is unreachable)"
        required: true
        default: "domain/orders-lifecycle"

concurrency:
  group: perf-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  perf-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El paso "Post PR comment with results" escribe en el PR; sin esto Octokit
    # falla con 403 y tumba el job entero.
    permissions:
      contents: read
      pull-requests: write

    # Output quality gate result for downstream jobs
    outputs:
      gate_passed: ${{ steps.quality-gate.outputs.gate_passed }}
      report_url: ${{ steps.quality-gate.outputs.report_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"

      - name: Put k6 in a trusted directory
        # The runners never resolve k6 through PATH (bin/_run-guard.sh).
        run: sudo install -m 0755 "$(command -v k6)" /usr/local/bin/k6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Build TypeScript
        run: npm run build

      - name: Run quality gate (smoke profile)
        id: quality-gate
        env:
          # T-088 / T-085: el runner todavia NO lee estas dos (grep en run-test.sh da 0).
          # Se dejan porque el contrato del pipeline ya las expone; hoy no tienen efecto.
          TEST_CONFIG: ${{ vars.PERF_TEST_CONFIG }}
          QG_THRESHOLDS_OVERRIDE: ${{ vars.PERF_QG_THRESHOLDS_OVERRIDE }}
          NOTIFY_SLACK_WEBHOOK: ${{ secrets.PERF_SLACK_WEBHOOK }}
          # El runner falla cerrado si el cliente no trae rbac.json. En CI no hay
          # usuario al que autorizar; el bypass queda registrado en el audit log.
          K6_RBAC_PERMISSIVE: "true"
          # Los inputs pasan por env y no se interpolan en el script: un input con
          # comillas o $(...) no puede inyectar comandos en el runner.
          IN_CLIENT: ${{ github.event.inputs.client || '_reference' }}
          IN_ENV: ${{ github.event.inputs.env || 'staging' }}
          IN_SCENARIO: ${{ github.event.inputs.scenario || 'domain/orders-lifecycle' }}
        run: |
          CLIENT="${IN_CLIENT}"
          ENV="${IN_ENV}"
          SCENARIO="${IN_SCENARIO}"
          GATE_DIR="reports/gate-${{ github.run_id }}"

          # El runner rechaza un --reports-dir cuyo padre no existe, y reports/ no
          # esta en git: en un checkout limpio hay que crearlo.
          mkdir -p "${GATE_DIR}"
          set +e
          bash bin/run-test.sh \
            --client="${CLIENT}" \
            --env="${ENV}" \
            --scenario="${SCENARIO}" \
            --profile=smoke \
            --reports-dir="${GATE_DIR}"
          EXIT_CODE=$?
          set -e

          # El runner nombra los artefactos con un timestamp, asi que se busca el summary
          # en vez de construir la ruta.
          SUMMARY="$(find "${GATE_DIR}" -name 'summary-*.json' 2>/dev/null | sort | tail -1 || true)"

          # Codigos del runner: 0 = thresholds cumplidos, 99 = SLOs no cumplidos,
          # 1 = error o regresion critica, 107 = error de build/script.
          case $EXIT_CODE in
            0)  echo "gate_passed=true"  >> "$GITHUB_OUTPUT" ;;
            *)  echo "gate_passed=false" >> "$GITHUB_OUTPUT" ;;
          esac

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "gate_dir=${GATE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Generate quality gate report
        if: always() && steps.quality-gate.outputs.summary != ''
        env:
          SUMMARY: ${{ steps.quality-gate.outputs.summary }}
        run: |
          node bin/generate-report.js \
            --input="${SUMMARY}" \
            --output="reports/gate-${{ github.run_id }}.html" || true

      - name: Upload gate report as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-gate-report-${{ github.run_id }}
          path: |
            reports/gate-${{ github.run_id }}/**
            reports/gate-${{ github.run_id }}.html
          retention-days: 14

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Valores por env: interpolarlos en el script abre inyeccion de JavaScript.
          GATE_PASSED: ${{ steps.quality-gate.outputs.gate_passed }}
          EXIT_CODE: ${{ steps.quality-gate.outputs.exit_code }}
          IN_ENV: ${{ github.event.inputs.env || 'staging' }}
          IN_SCENARIO: ${{ github.event.inputs.scenario || 'domain/orders-lifecycle' }}
        with:
          script: |
            const passed = process.env.GATE_PASSED === 'true';
            const exitCode = process.env.EXIT_CODE;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            // Mapa de salida de bin/run-test.sh (cabecera del script).
            const exitCodeDesc = {
              '0': 'All thresholds passed',
              '1': 'Test/framework error or critical regression (auto-comparison)',
              '99': 'Thresholds failed (SLOs not met) or baseline regression',
              '107': 'Script/build error',
              '108': 'Gated scenario without its unlock flag',
              '109': 'Guarded run without a human approval'
            }[exitCode] || `Unknown (${exitCode})`;

            const body = `## ${passed ? '✅' : '❌'} Performance Quality Gate — ${passed ? 'PASS' : 'FAIL'}

            | Field       | Value |
            |---|---|
            | Exit code   | \`${exitCode}\` — ${exitCodeDesc} |
            | Scenario    | \`${process.env.IN_SCENARIO}\` |
            | Profile     | \`smoke\` |
            | Environment | \`${process.env.IN_ENV}\` |
            | Report      | [View artifacts](${runUrl}) |

            ${!passed ? '> ⚠️ **This PR is blocked pending performance regression fix.**\n> Review the threshold failures in the artifact report.' : '> All performance thresholds are within acceptable limits.'}

            <sub>Generated by [perf-gate workflow](${runUrl})</sub>`;

            // Find existing comment to update (avoid duplicate comments)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('Performance Quality Gate'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if quality gate did not pass
        if: steps.quality-gate.outputs.gate_passed != 'true'
        env:
          EXIT_CODE: ${{ steps.quality-gate.outputs.exit_code }}
        run: |
          echo "::error::Performance quality gate FAILED (exit code: ${EXIT_CODE})"
          echo "Review the performance report artifact for threshold details."
          exit 1
