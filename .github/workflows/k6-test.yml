# T-140: k6 Enterprise Framework — Self-test CI pipeline
# Runs on push, PRs, and manual dispatch with input validation.
#
# Security controls:
# - Minimal permissions (contents: read only)
# - Actions pinned by SHA (not mutable tags)
# - Inputs from workflow_dispatch validated with regex before use
# - Secrets injected via GitHub Secrets, never written to files
# - detect-secrets step blocks pipeline if credentials are found in source

name: k6 Framework CI

on:
  push:
    branches:
      - main
      - "001-*"
      - "feature/*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: "Load profile to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - quick
      scenario:
        description: "Scenario path (e.g. api/smoke-users)"
        required: true
        default: "api/smoke-users"

# Minimal permissions — read repo content only
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  K6_CLIENT: "_reference"
  K6_ENV: "default"

jobs:

  # ── Step 1: Detect hardcoded secrets ──────────────────────────────────────
  detect-secrets:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
      - name: Run secrets scanner
        run: node bin/testing/detect-secrets.js

  # ── Step 2: Lint and type-check ───────────────────────────────────────────
  lint-and-build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Step 3: Smoke test ────────────────────────────────────────────────────
  smoke-test:
    name: Run k6 smoke test
    needs: [detect-secrets, lint-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # El metodo apt/gpg no funciona en los runners: gpg no tiene dirmngr y falla
      # con "keyserver receive failed". Se usa la misma action que el resto de los
      # workflows, con la version pineada en un solo lugar.
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.3.0"

      - name: Validate workflow inputs
        # T-140: Sanitize inputs from workflow_dispatch before use in shell
        run: |
          PROFILE="${{ inputs.profile || 'smoke' }}"
          SCENARIO="${{ inputs.scenario || 'api/smoke-users' }}"
          if [[ ! "${PROFILE}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: Invalid profile input: ${PROFILE}" >&2
            exit 1
          fi
          if [[ ! "${SCENARIO}" =~ ^[a-zA-Z0-9_/.-]+$ ]]; then
            echo "ERROR: Invalid scenario input: ${SCENARIO}" >&2
            exit 1
          fi
          # Export validated values for subsequent steps
          echo "VALIDATED_PROFILE=${PROFILE}" >> "${GITHUB_ENV}"
          echo "VALIDATED_SCENARIO=${SCENARIO}" >> "${GITHUB_ENV}"

      - name: Run smoke test
        # Secrets are passed as environment variables, never as CLI arguments
        run: |
          ./bin/run-test.sh \
            --client "${K6_CLIENT}" \
            --scenario "${VALIDATED_SCENARIO}" \
            --profile "${VALIDATED_PROFILE}" \
            --env "${K6_ENV}"
        env:
          K6_SECRETS_BACKENDS: env
          # El runner falla cerrado si el cliente no trae rbac.json y en CI no hay
          # usuario al que autorizar. El bypass queda en el audit log.
          K6_RBAC_PERMISSIVE: "true"
          # Application secrets: set in GitHub repository Settings > Secrets
          # Uncomment and configure as needed:
          # APP_API_KEY: ${{ secrets.APP_API_KEY }}
          # APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-reports-${{ github.run_id }}
          path: reports/
          retention-days: 7
