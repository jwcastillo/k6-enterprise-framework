# Anchors this repo as its own pnpm workspace root so installs don't get
# captured by a stray pnpm-workspace.yaml in an ancestor directory.
packages:
  - .

# Security overrides — force patched versions of vulnerable transitive deps.
# (pnpm 10+ reads overrides from here, not from package.json's "pnpm" field.)
overrides:
  # js-yaml se queda en la linea 4.x: gray-matter (docs-site) no soporta 5.x.
  # 4.2.0 quedo vulnerable, 4.3.2 corrige sin salir de 4.x.
  js-yaml: 4.3.2
  lodash: 4.18.1
  tmp: 0.2.7
  vite: 8.0.16
  # Transitivas con CVE. brace-expansion vive en dos lineas a la vez en el arbol,
  # asi que se acota por rango en vez de forzar una sola version para todos.
  baseline-browser-mapping: ^2.11.0
  browserslist: ^4.28.7
  fast-uri: ^3.1.6
  brace-expansion@1: ^1.1.18
  brace-expansion@>=3: ^5.0.9

# pnpm 10+ no ejecuta scripts de instalacion salvo que se declaren, y aborta con
# ERR_PNPM_IGNORED_BUILDS si alguno queda pendiente. @datadog/pprof es nativo y
# llega por @pyroscope/nodejs, que es optionalDependency: en macOS trae binario
# prebuilt y no compila nada, en Linux si. Se deniega a proposito — el
# framework y sus tests no lo necesitan; quien use profiling continuo lo cambia
# a true en su maquina. pnpm 11 reemplazo ignoredBuiltDependencies por
# allowBuilds; con la clave vieja reescribe este archivo en cada install.
allowBuilds:
  "@datadog/pprof": false
