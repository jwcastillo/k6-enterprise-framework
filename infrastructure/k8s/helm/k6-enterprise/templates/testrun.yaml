{{- /*
  k6 Enterprise Framework — TestRun CRD template
  Requires k6-operator to be installed in the cluster.
  Install: kubectl apply -f https://raw.githubusercontent.com/grafana/k6-operator/main/bundle.yaml
*/ -}}
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: {{ .Values.test.name | quote }}
  namespace: {{ .Values.test.namespace | quote }}
  labels:
    app: k6-runner
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parallelism: {{ .Values.test.parallelism }}

  # k6 CLI args (p. ej. "-o experimental-prometheus-rw" para push a Prometheus).
  # testid siempre va: los dashboards filtran por él y una corrida sin testid no se puede elegir.
  {{- $testid := .Values.test.testid | default (printf "%s-%s" .Values.test.name (now | date "0102-1504")) }}
  arguments: {{ trim (printf "%s --tag testid=%s" .Values.test.arguments $testid) | quote }}

  script:
    configMap:
      name: {{ .Values.test.script.configMap.name | quote }}
      file: {{ .Values.test.script.configMap.file | quote }}

  runner:
    image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    serviceAccountName: {{ .Values.runner.serviceAccountName | quote }}

    resources:
      requests:
        cpu: {{ .Values.runner.resources.requests.cpu | quote }}
        memory: {{ .Values.runner.resources.requests.memory | quote }}
      limits:
        cpu: {{ .Values.runner.resources.limits.cpu | quote }}
        memory: {{ .Values.runner.resources.limits.memory | quote }}

    env:
    {{- range $key, $val := .Values.runner.env }}
      - name: {{ $key }}
        value: {{ $val | quote }}
    {{- end }}
    {{- if .Values.prometheus.remoteWrite.enabled }}
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: {{ .Values.prometheus.remoteWrite.url | quote }}
    {{- end }}

    {{- if .Values.runner.envFromSecret.name }}
    envFrom:
      - secretRef:
          name: {{ .Values.runner.envFromSecret.name | quote }}
    {{- end }}

    {{- if .Values.runner.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.runner.nodeSelector | nindent 6 }}
    {{- end }}

    {{- if .Values.runner.tolerations }}
    tolerations:
      {{- toYaml .Values.runner.tolerations | nindent 6 }}
    {{- end }}

    {{- if .Values.runner.affinity }}
    affinity:
      {{- toYaml .Values.runner.affinity | nindent 6 }}
    {{- end }}

    {{- $data := or .Values.test.dataUrl.url .Values.test.dataSecret.name }}
    {{- if .Values.test.dataUrl.url }}
    # Data over the Secret size limit: downloaded before k6 starts.
    initContainers:
      - name: fetch-data
        image: curlimages/curl:8.22.0
        command: ["sh", "-c", 'curl -fsS --retry 3 -o "{{ .Values.test.dataSecret.mountPath }}/{{ .Values.test.dataUrl.file }}" "$DATA_URL"']
        env:
          - name: DATA_URL
            value: {{ .Values.test.dataUrl.url | quote }}
        volumeMounts:
          - name: data
            mountPath: {{ .Values.test.dataSecret.mountPath }}
    {{- end }}

    {{- if or .Values.persistence.enabled $data }}
    volumeMounts:
      {{- if .Values.persistence.enabled }}
      - name: reports
        mountPath: {{ .Values.persistence.mountPath }}
      {{- end }}
      {{- if $data }}
      - name: data
        mountPath: {{ .Values.test.dataSecret.mountPath }}
        readOnly: true
      {{- end }}
    volumes:
      {{- if .Values.persistence.enabled }}
      - name: reports
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-reports
      {{- end }}
      {{- if .Values.test.dataUrl.url }}
      - name: data
        emptyDir: {}
      {{- else if .Values.test.dataSecret.name }}
      # Data file(s) that carry secrets/PII (e.g. captured session cookies for
      # replay). k6 reads them via open() at the mountPath (REPLAY_FILE).
      - name: data
        secret:
          secretName: {{ .Values.test.dataSecret.name }}
      {{- end }}
    {{- end }}
